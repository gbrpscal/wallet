name: wallet

# Papéis do banco (criados por deploy/postgres/init-roles.sh):
#   wallet_owner  dono do schema, usado só pelas migrations e testes de schema
#   wallet_app    usado pela aplicação, com privilégios mínimos
x-db-app-url: &db-app-url postgres://wallet_app:${WALLET_APP_PASSWORD:-wallet_app}@postgres:5432/${WALLET_DB:-wallet}?sslmode=disable
x-db-owner-url: &db-owner-url postgres://wallet_owner:${WALLET_OWNER_PASSWORD:-wallet_owner}@postgres:5432/${WALLET_DB:-wallet}?sslmode=disable

x-aws-env: &aws-env
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  AWS_ENDPOINT_URL: http://localstack:4566

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      # Superusuário usado apenas pelo entrypoint para criar papéis e banco.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      WALLET_DB: ${WALLET_DB:-wallet}
      WALLET_OWNER_PASSWORD: ${WALLET_OWNER_PASSWORD:-wallet_owner}
      WALLET_APP_PASSWORD: ${WALLET_APP_PASSWORD:-wallet_app}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${WALLET_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"
    healthcheck:
      # A imagem não tem curl/wget; o /dev/tcp do bash alcança a porta de gerenciamento.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
    volumes:
      - ./deploy/localstack/init-queues.sh:/etc/localstack/init/ready.d/10-init-queues.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./deploy/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  # Aplica as migrations como wallet_owner e termina. A aplicação só sobe
  # depois que ele conclui com sucesso.
  migrate:
    build:
      context: .
      target: tools
    command: ["goose", "-dir", "/migrations", "up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: *db-owner-url
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    environment:
      <<: *aws-env
      HTTP_ADDR: ":8080"
      DATABASE_URL: *db-app-url
      SQS_WAGER_QUEUE_NAME: wager-transactions.fifo
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
      DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:-5s}
      REFERENCE_MAX_ATTEMPTS: ${REFERENCE_MAX_ATTEMPTS:-10}
      REFERENCE_TTL: ${REFERENCE_TTL:-10m}
      REFERENCE_BACKOFF_BASE: ${REFERENCE_BACKOFF_BASE:-1s}
      REFERENCE_BACKOFF_MAX: ${REFERENCE_BACKOFF_MAX:-60s}
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # Toolchain de desenvolvimento. Só sobe explicitamente: `docker compose run --rm tools <cmd>`.
  tools:
    build:
      context: .
      target: tools
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /src
    environment:
      <<: *aws-env
      DATABASE_URL: *db-app-url
      DATABASE_OWNER_URL: *db-owner-url
      # Comandos do goose rodados a partir do container tools.
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: *db-owner-url
      GOOSE_MIGRATION_DIR: /src/migrations
    volumes:
      - .:/src
      - go-mod-cache:/cache/mod
      - go-build-cache:/cache/build

volumes:
  pgdata:
  go-mod-cache:
  go-build-cache:
