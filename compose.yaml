name: wallet

x-db-url: &db-url postgres://${POSTGRES_USER:-wallet}:${POSTGRES_PASSWORD:-wallet}@postgres:5432/${POSTGRES_DB:-wallet}?sslmode=disable

x-aws-env: &aws-env
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  AWS_ENDPOINT_URL: http://localstack:4566

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet}
      POSTGRES_DB: ${POSTGRES_DB:-wallet}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"
    healthcheck:
      # The image ships without curl/wget; bash /dev/tcp reaches the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
    volumes:
      - ./deploy/localstack/init-queues.sh:/etc/localstack/init/ready.d/10-init-queues.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./deploy/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  app:
    build:
      context: .
      target: runtime
    environment:
      <<: *aws-env
      HTTP_ADDR: ":8080"
      DATABASE_URL: *db-url
      SQS_WAGER_QUEUE_NAME: wager-transactions.fifo
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # Development toolchain. Only started explicitly: `docker compose run --rm tools <cmd>`.
  tools:
    build:
      context: .
      target: tools
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /src
    environment:
      <<: *aws-env
      DATABASE_URL: *db-url
    volumes:
      - .:/src
      - go-mod-cache:/cache/mod
      - go-build-cache:/cache/build

volumes:
  pgdata:
  go-mod-cache:
  go-build-cache:
